context:
  # IlmBase ended at 2.5.x; OpenEXR 3.x is packaged by openexr and imath.
  version: "3.5.3"

package:
  name: ilmbase
  version: ${{ version }}

source:
  url: https://github.com/AcademySoftwareFoundation/openexr/archive/v${{ version }}.tar.gz
  sha256: ff1de95f4031c1c57c633e647dc97c15282d3aa3bc7fb90745f00f74de4a054f
  patches:
    - patches/0001-find-threads-dependency.patch

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
  run_exports:
    - ${{ pin_subpackage('ilmbase', upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - OpenEXR/half.h
        - OpenEXR/IlmThread.h
        - OpenEXR/ImathMath.h
        - OpenEXR/Iex.h
        - OpenEXR/IexMathExc.h
      lib:
        - Half
        - IlmThread
        - Imath
        - Iex
        - IexMath
      files:
        - "**/lib/cmake/IlmBase/IlmBaseConfig.cmake"
        - "**/lib/pkgconfig/IlmBase.pc"
  - script:
      - if: unix
        then: cmake -S test -B build-test -G Ninja ${CMAKE_ARGS}
        else: cmake -S test -B build-test -G Ninja %CMAKE_ARGS%
      - cmake --build build-test
      - ctest --test-dir build-test --output-on-failure
    requirements:
      build:
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake
        - ninja
    files:
      recipe:
        - test/

about:
  homepage: https://openexr.com/
  license: BSD-3-Clause
  license_file: LICENSE.md
  summary: Legacy IlmBase libraries for OpenEXR 2.x.
  documentation: https://openexr.com/en/latest/PortingGuide.html
  repository: https://github.com/AcademySoftwareFoundation/openexr

extra:
  recipe-maintainers:
    - npavlovikj
    - SylvainCorlay
    - wolfv
    - JohanMabille
